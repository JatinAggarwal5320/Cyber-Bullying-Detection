<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BABE — Control Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-row">
        <img src="../icons/icon-48.png" alt="BABE" class="logo-icon" width="32" height="32">
        <div class="logo-text">
          <h1>BABE</h1>
          <p class="tagline">Bullies &amp; Bullying Eradicated</p>
        </div>
      </div>
      <label class="master-switch" id="master-switch-label">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="switch-track">
          <span class="switch-thumb"></span>
        </span>
      </label>
    </header>

    <!-- Status Banner -->
    <div class="status-banner" id="status-banner">
      <span class="status-dot"></span>
      <span class="status-text" id="status-text">Protection Active</span>
    </div>

    <!-- Stats Row -->
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-number" id="stat-pages">0</span>
        <span class="stat-label">Pages Scanned</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card">
        <span class="stat-number" id="stat-blocked">0</span>
        <span class="stat-label">Blocked</span>
      </div>
    </div>

    <!-- Settings Section -->
    <div class="settings-section">
      <h2 class="section-title">Settings</h2>

      <!-- Model Selector -->
      <div class="setting-row">
        <div class="setting-info">
          <span class="setting-name">Detection Model</span>
          <span class="setting-desc">Choose the ML model for scanning</span>
        </div>
        <select id="model-select" class="setting-select">
          <option value="svc">LinearSVC</option>
          <option value="lr">Logistic Regression</option>
        </select>
      </div>

      <!-- Sensitivity Slider -->
      <div class="setting-row setting-row-col">
        <div class="setting-info">
          <span class="setting-name">Sensitivity</span>
          <span class="setting-desc">Higher = more aggressive filtering</span>
        </div>
        <div class="slider-container">
          <span class="slider-label">Low</span>
          <input type="range" id="sensitivity-slider" min="-2" max="2" step="0.1" value="0">
          <span class="slider-label">High</span>
          <span class="slider-value" id="sensitivity-value">0.0</span>
        </div>
      </div>
    </div>

    <!-- Whitelist Section -->
    <div class="settings-section">
      <h2 class="section-title">Whitelisted Domains</h2>
      <p class="section-desc">BABE won't scan pages on these domains.</p>
      <div class="whitelist-input-row">
        <input type="text" id="whitelist-input" class="whitelist-input" placeholder="e.g. example.com">
        <button id="whitelist-add" class="btn-add">+ Add</button>
      </div>
      <ul class="whitelist-list" id="whitelist-list">
        <!-- populated dynamically -->
      </ul>
    </div>

    <!-- Reset Stats -->
    <div class="footer-row">
      <button id="reset-stats" class="btn-reset">Reset Statistics</button>
      <span class="version">v1.0.0</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
